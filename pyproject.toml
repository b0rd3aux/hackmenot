[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hackmenot"
version = "2.0.0"
description = "AI-Era Code Security Scanner - catches vulnerabilities AI coding assistants introduce"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "b0rd3aux" }
]
keywords = ["security", "scanner", "ai", "code-analysis", "sast", "vulnerability", "copilot", "cursor", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.5",
    "python-hcl2>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
hackmenot = "hackmenot.cli.main:app"

[project.urls]
Homepage = "https://github.com/b0rd3aux/hackmenot"
Repository = "https://github.com/b0rd3aux/hackmenot"
Documentation = "https://github.com/b0rd3aux/hackmenot/tree/main/docs"
Issues = "https://github.com/b0rd3aux/hackmenot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hackmenot"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/hackmenot/**/*.py",
    "src/hackmenot/**/*.yml",
    "src/hackmenot/**/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "BLE",    # flake8-blind-except (no bare except)
    "PTH",    # flake8-use-pathlib (prefer pathlib over os.path)
    "PLC",    # pylint convention
    "PLE",    # pylint errors
    "PLW",    # pylint warnings
    "RUF",    # ruff-specific rules
    "SIM",    # flake8-simplify
    "TRY",    # tryceratops (exception handling)
]
ignore = [
    "E501",    # Line too long - too many pre-existing violations
    "TRY003",  # Allow long exception messages
    "TRY300",  # Allow return in try block (else block is pedantic)
    "TRY301",  # Allow raise in try block
    "PTH123",  # Allow open() - pathlib alternative is verbose
    "PLW2901", # Allow loop variable overwrite (common pattern)
    "SIM108",  # Allow if-else instead of ternary (readability)
    "SIM102",  # Allow nested if (sometimes clearer than combined)
    "PLC0415", # Allow imports not at top level (lazy imports are intentional)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "SIM117", "F841", "E741"]  # Allow magic numbers, nested with, unused vars in tests
"tests/fixtures/**/*.py" = ["F821", "E501"]  # Test fixtures have intentionally bad code
"src/hackmenot/core/__init__.py" = ["PLC0415"]  # Lazy imports are intentional
"src/hackmenot/parsers/python.py" = ["N802"]  # AST visitor methods must match node names
"src/hackmenot/parsers/*.py" = ["BLE001", "RUF012"]  # Parsers catch broad exceptions intentionally
"src/hackmenot/reporters/*.py" = ["RUF012"]  # Reporter class mappings are fine
"src/hackmenot/fixes/engine.py" = ["BLE001"]  # Fall-through exception handling

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
